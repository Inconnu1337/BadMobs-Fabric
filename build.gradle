plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
    id 'idea'
}

if (System.getenv('BUILD_NUMBER') != null) {
    version = "${project.version}.${System.getenv('BUILD_NUMBER')}"
} else {
    version = project.version
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(java_version))
    }
}

repositories {
    mavenCentral()
    gradlePluginPortal()
    maven { url = "https://maven.parchmentmc.org" }
}

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

loom {
    mixin {
        defaultRefmapName = "${mod_id}.refmap.json"
    }
}

processResources {
    def replaceProperties = [
            minecraft_version    : minecraft_version,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_author           : mod_author,
            mod_description      : mod_description,
            mod_license          : mod_license,
            version              : version,
            fabric_loader_version: fabric_loader_version,
            curse_page           : project.hasProperty('curse_page') ? project.curse_page : "",
            mod_repo             : project.hasProperty('mod_repo') ? project.mod_repo : ""
    ]

    inputs.properties(replaceProperties)

    filesMatching("fabric.mod.json") {
        expand replaceProperties
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}